name: Validate Streamlit App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  validate-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify data files and analytics module
        run: |
          python -c "
          from src.data_loader import load_crimes_data, load_population_data, load_map_data
          crimes = load_crimes_data()
          pop = load_population_data()
          mapa = load_map_data()
          assert len(crimes) > 0 and len(pop) > 0 and len(mapa) == 853
          print('Dados validados:', len(crimes), len(pop), len(mapa))
          "

      - name: Check Streamlit startup health
        run: |
          streamlit run app.py --server.headless true --server.port 8501 &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo "Streamlit healthy"
              kill $APP_PID || true
              exit 0
            fi
            sleep 2
          done
          kill $APP_PID || true
          exit 1
